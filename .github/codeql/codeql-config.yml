name: TIA SCL Studio CodeQL configuration

paths:
  - src
  - tools

paths-ignore:
  # Test code deliberately constructs deformed models, passes null where null is
  # not allowed and reads paths built from test input. Scanning it produces
  # findings that describe the tests rather than the product.
  - tests
  - artifacts
  - packages
  - '**/bin'
  - '**/obj'
  # XAML code-behind partials are generated by MSBuild, not written by hand.
  - '**/*.g.cs'
  - '**/*.g.i.cs'

# No query filters. Nothing here has been triaged yet, so suppressing a rule
# before seeing what it reports would hide the findings this was set up to find.
# Add an exclusion only with the finding it refers to written next to it.
