# SonarQube analysis settings for TIA SCL Studio.
#
# The .NET analyser needs the SonarScanner for MSBuild, which reads most of its
# configuration from the begin/end command line rather than this file. What
# stays here is everything that is a property of the project itself and should
# not have to be retyped on every run. build\Invoke-SonarQube.ps1 passes these
# through, so keep the two in step.

sonar.projectKey=tia-scl-studio
sonar.projectName=TIA SCL Studio
sonar.projectVersion=0.2.0

# A locally hosted SonarQube. Override with -HostUrl on the analysis script.
sonar.host.url=http://localhost:9000

sonar.sourceEncoding=UTF-8

# The analyser discovers sources through MSBuild, so these paths only matter for
# the files MSBuild does not compile.
sonar.sources=src
sonar.tests=tests

# Generated output, build staging and the vendored self-test corpus are not
# reviewable code and would otherwise dominate every measurement.
sonar.exclusions=\
  artifacts/**,\
  packages/**,\
  **/bin/**,\
  **/obj/**,\
  **/*.g.cs,\
  **/*.g.i.cs,\
  **/AssemblyInfo.cs

sonar.test.exclusions=\
  artifacts/**,\
  packages/**,\
  **/bin/**,\
  **/obj/**

# Coverage is produced by build\Invoke-Tests.ps1 -Coverage as one OpenCover
# report per suite. SonarQube unions them, so a line covered by any suite counts.
sonar.cs.opencover.reportsPaths=artifacts/test-results/opencover-*.xml
sonar.cs.vstest.reportsPaths=artifacts/test-results/*.trx

# The generated designer partials are not hand written and their diagnostics are
# noise that hides the real ones.
sonar.coverage.exclusions=\
  tools/selftest/**,\
  tests/**,\
  **/*.xaml.cs

# The self-test harness is test code that happens to ship as an executable.
sonar.cpd.exclusions=\
  tools/selftest/**,\
  tests/**
